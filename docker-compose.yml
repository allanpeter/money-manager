x-database-environment: &database-environment
  DATABASE_URL: postgres://money_manager:${PG_MONEY_MANAGER_PASSWORD:?PG_MONEY_MANAGER_PASSWORD não configurada}@192.168.0.41:5432/money_manager
  DATABASE_SSL: "false"
  TZ: America/Sao_Paulo

x-runtime-image: &runtime-image
  image: money-manager:latest
  build: .

services:
  migrate:
    <<: *runtime-image
    command: npm run db:migrate
    environment: *database-environment
    restart: "no"

  app:
    <<: *runtime-image
    command: node server.js
    environment:
      <<: *database-environment
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    restart: unless-stopped

  assistant:
    <<: *runtime-image
    profiles: ["assistant"]
    command: npm run assistant
    environment:
      <<: *database-environment
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_REMINDER_CHANNEL_ID: ${DISCORD_REMINDER_CHANNEL_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      REMINDER_POLL_INTERVAL_MS: ${REMINDER_POLL_INTERVAL_MS:-900000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
